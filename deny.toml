[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# ISC, BSD-3-Clause and CDLA-Permissive-2.0 (root certificate data) come with the rustls TLS stack,
# Zlib with foldhash (hashbrown's default hasher).
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "ISC", "BSD-3-Clause", "CDLA-Permissive-2.0", "Zlib"]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between the unpublished workspace crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
